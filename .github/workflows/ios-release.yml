name: iOS release

# Build the app, sign it and upload it to App Store Connect. Run by hand only.
#
# Takes the version and build number from the Xcode project as committed, and refuses to
# change them: the stamp in the repository is what names a build, and two different builds
# must never carry the same number.
#
# Needs these repository secrets (docs/RELEASING.md says how each is made):
#   IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE,
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        default: main
      upload:
        description: Upload to App Store Connect (off = build and sign only, to test the setup)
        type: boolean
        default: true
      runner:
        description: Which machine builds it. xcode-27 has the iOS 27 SDK; macos-latest has Xcode 26.
        type: choice
        options: [xcode-27, macos-latest]
        default: xcode-27
      xcode:
        description: Xcode to build with, as a path under /Applications (blank = the runner's default)
        default: /Applications/Xcode_27.0.app

permissions:
  contents: read

concurrency: ios-release

env:
  TEAM_ID: 4985QRD6MB
  BUNDLE_ID: com.kendallcoding202.squishbox

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      # Which toolchain built a release is part of what the release is. 1.3 was built with the
      # iOS 27 SDK and 1.4 (13) with the iOS 26.5 one without anybody choosing that, and 1.4
      # is the update a player lost a collection on. `node scripts/asc.mjs builds` shows what
      # each uploaded build was made with.
      - name: Choose the toolchain
        env:
          XCODE: ${{ inputs.xcode }}
        run: |
          ls -d /Applications/Xcode*.app
          if [ -n "$XCODE" ]; then
            if [ ! -d "$XCODE" ]; then echo "$XCODE is not on this runner."; exit 1; fi
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -version -sdk iphoneos ProductBuildVersion

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Read the version stamp
        id: stamp
        run: |
          version=$(grep -m1 'MARKETING_VERSION = ' ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/')
          build=$(grep -m1 'CURRENT_PROJECT_VERSION = ' ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Building $version ($build) from $(git rev-parse --short HEAD)"

      - name: Build the web app into the iOS project
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run ios:sync

      - name: The sync must not have moved the stamp
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
          BUILD: ${{ steps.stamp.outputs.build }}
        run: |
          grep -q "MARKETING_VERSION = $VERSION;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = $BUILD;" ios/App/App.xcodeproj/project.pbxproj

      - name: Install the signing certificate and profile
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          for name in CERT_P12 CERT_PASSWORD PROFILE; do
            if [ -z "${!name}" ]; then echo "Secret for $name is not set. See docs/RELEASING.md."; exit 1; fi
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "Using profile \"$name\""
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<hash>/'

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -list
          # -project, not -workspace: Capacitor is on Swift Package Manager and there is no workspace.
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || {
              # The log runs to thousands of lines; show the errors and the ending, not all of it.
              grep -E "error:|warning: .*[Pp]rovisioning|ARCHIVE FAILED" -A 3 "$RUNNER_TEMP/archive.log" | tail -n 80
              tail -n 30 "$RUNNER_TEMP/archive.log"
              exit 1
            }
          tail -n 5 "$RUNNER_TEMP/archive.log"

      - name: Export the IPA
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" > "$RUNNER_TEMP/export.log" 2>&1 || {
              grep -E "error:|EXPORT FAILED" -A 3 "$RUNNER_TEMP/export.log" | tail -n 60
              tail -n 30 "$RUNNER_TEMP/export.log"
              exit 1
            }
          tail -n 3 "$RUNNER_TEMP/export.log"

      - name: Check the IPA is the build the stamp names
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
          BUILD: ${{ steps.stamp.outputs.build }}
        run: |
          set -euo pipefail
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          plist=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -n 1)/Info.plist
          got_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          got_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          got_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          echo "IPA is $got_id $got_version ($got_build)"
          [ "$got_version" = "$VERSION" ] && [ "$got_build" = "$BUILD" ] && [ "$got_id" = "$BUNDLE_ID" ]
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Summary
        if: ${{ success() }}
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
          BUILD: ${{ steps.stamp.outputs.build }}
          UPLOADED: ${{ inputs.upload }}
        run: |
          if [ "$UPLOADED" = "true" ]; then
            echo "Uploaded $VERSION ($BUILD). Apple processes it for a few minutes; then run App Store > prepare with version $VERSION and build $BUILD." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built and signed $VERSION ($BUILD). Not uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the keys from the runner
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
