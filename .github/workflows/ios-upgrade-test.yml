name: iOS upgrade test

# Does a save survive installing one build over another? Run by hand.
#
# Written after a player lost a whole collection updating from 1.3 to 1.4. Apple's records
# (node scripts/asc.mjs builds) show the two were made with different toolchains: 1.3 on a
# Mac with the iOS 27 SDK, 1.4 (13) on a runner with the iOS 26.5 SDK. So this builds each
# release both ways, installs them over one another on an iOS 27 simulator in the orders
# that matter, and prints what the player would see and what is on disk after each.
#
# It touches nothing outside the runners: no signing, no secrets, no App Store.
on:
  workflow_dispatch:
    inputs:
      old_ref:
        description: The release people had (1.3)
        default: ca8c605573ee508ae97e0d4f73e7b0c5fbc1fc6f
      mid_ref:
        description: The release that lost the save (1.4 build 13)
        default: 417f026b5930d0ec437ad0c88188c09cfd5f4880
      new_ref:
        description: The fix
        default: main

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: old-sdk26, os: macos-26, ref: "${{ inputs.old_ref }}", seed: true, probe: true, xcode: "" }
          - { name: old-sdk27, os: xcode-27, ref: "${{ inputs.old_ref }}", seed: true, probe: true, xcode: /Applications/Xcode_27.0.app }
          - { name: v14-sdk26, os: macos-26, ref: "${{ inputs.mid_ref }}", seed: false, probe: true, xcode: "" }
          - { name: fix-sdk26, os: macos-26, ref: "${{ inputs.new_ref }}", seed: false, probe: true, xcode: "" }
          - { name: fix-sdk27, os: xcode-27, ref: "${{ inputs.new_ref }}", seed: false, probe: true, xcode: /Applications/Xcode_27.0.app }
          # 1.4 (13) with nothing added to it at all, in case the probe changes what it is looking at.
          - { name: v14-sdk26-plain, os: macos-26, ref: "${{ inputs.mid_ref }}", seed: false, probe: false, xcode: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build for the simulator
        env:
          XCODE: ${{ matrix.xcode }}
          SEED: ${{ matrix.seed }}
          PROBE: ${{ matrix.probe }}
          NAME: ${{ matrix.name }}
        run: |
          set -o pipefail
          ls -d /Applications/Xcode*.app
          if [ -n "$XCODE" ]; then export DEVELOPER_DIR="$XCODE/Contents/Developer"; fi
          xcodebuild -version
          cd app
          npm ci
          npm run build
          # Test builds report what they see through the console; the old ones also start with a
          # save somebody has played. See scripts/diagnose/probe-build.mjs.
          if [ "$SEED" = "true" ]; then
            node ../tools/scripts/diagnose/probe-build.mjs dist/index.html --seed ../tools/tests/fixtures/save-1.3-rich.json
          elif [ "$PROBE" = "true" ]; then
            node ../tools/scripts/diagnose/probe-build.mjs dist/index.html
          fi
          npx cap sync ios
          if [ "$PROBE" = "true" ]; then
            node -e 'const fs=require("fs");const f="ios/App/App/capacitor.config.json";const c=JSON.parse(fs.readFileSync(f,"utf8"));c.loggingBehavior="production";fs.writeFileSync(f,JSON.stringify(c,null,1));'
          fi
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E "error:" -A 3 "$RUNNER_TEMP/build.log" | tail -n 60; tail -n 30 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -n 2 "$RUNNER_TEMP/build.log"
          products="$RUNNER_TEMP/build/Build/Products/Release-iphonesimulator"
          app="$products/App.app"
          p() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          echo "== $NAME: $(p CFBundleShortVersionString) ($(p CFBundleVersion)) sdk=$(p DTSDKName) sdkBuild=$(p DTSDKBuild) xcode=$(p DTXcode)"
          cat "$app/capacitor.config.json"; echo
          ls "$app" | tr '\n' ' '; echo
          tar -C "$products" -cf "$RUNNER_TEMP/$NAME.tar" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          retention-days: 3

  run:
    name: ${{ matrix.id }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # What happened: 1.3 from the Mac, then 1.4 from the runner. Then each way of fixing it.
          - { id: what-happened-then-fix-sdk27, runtime: latest, steps: "old-sdk27 v14-sdk26 fix-sdk27" }
          - { id: what-happened-then-fix-sdk26, runtime: latest, steps: "old-sdk27 v14-sdk26 fix-sdk26" }
          - { id: what-happened-on-ios-27-0, runtime: "27.0", steps: "old-sdk27 v14-sdk26 fix-sdk27" }
          - { id: what-happened-unprobed, runtime: latest, steps: "old-sdk27 v14-sdk26-plain" }
          # The whole history of a phone that had every release: 1.2-style, 1.3, 1.4.
          - { id: full-history, runtime: latest, steps: "old-sdk26 old-sdk27 v14-sdk26" }
          # The fix itself: the web view's storage is lost outright, and the toolchain changes again.
          - { id: fix-survives-a-wipe, runtime: latest, steps: "old-sdk27 fix-sdk27 WIPE fix-sdk27" }
          - { id: fix-survives-a-toolchain-change, runtime: latest, steps: "old-sdk27 fix-sdk27 fix-sdk26 fix-sdk27" }
          # For comparison: the same toolchain throughout, and the very same build twice.
          - { id: same-toolchain, runtime: latest, steps: "old-sdk26 v14-sdk26 fix-sdk26" }
          - { id: same-build-twice, runtime: latest, steps: "old-sdk27 old-sdk27" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: tars
          merge-multiple: true
      - name: Run the builds over one another
        env:
          RUNTIME: ${{ matrix.runtime }}
          STEPS: ${{ matrix.steps }}
        run: |
          for tar in tars/*.tar; do
            name=$(basename "$tar" .tar)
            mkdir -p "apps/$name"
            tar -C "apps/$name" -xf "$tar"
          done
          ls apps
          xcodebuild -version
          # shellcheck disable=SC2086
          bash scripts/diagnose/run-sequence.sh "$RUNTIME" $STEPS
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: screens-${{ matrix.id }}
          path: shots
          retention-days: 3
